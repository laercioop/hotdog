<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atualizar Campanha do Hotdog | ASJ</title>
    <link rel="icon" href="asj.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,500;6..12,700;6..12,800;6..12,900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      body{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--blue-soft)}.generator{width:min(100%,640px);background:var(--white);padding:clamp(25px,6vw,58px);border-top:7px solid var(--red);border-radius:12px}.generator-logo{width:145px;display:block;margin-bottom:20px}.generator .campaign-kicker{margin:0 0 6px;color:var(--red);font-size:.75rem;font-weight:900;text-transform:uppercase}.generator h1{margin:0 0 12px;color:var(--navy);font-size:clamp(2.2rem,6vw,4rem);line-height:1}.generator p{color:var(--muted);line-height:1.55}.generator form{display:grid;gap:18px;margin-top:30px}.generator label{display:grid;gap:7px;font-size:.9rem;font-weight:900;color:var(--blue)}.generator input,.generator textarea{width:100%;border:2px solid var(--line);border-radius:5px;padding:12px 14px;background:var(--white);color:var(--ink);font:inherit;font-weight:700}.generator input:focus,.generator textarea:focus{outline:3px solid oklch(0.75 .1 250);outline-offset:1px;border-color:var(--blue)}.generator textarea{min-height:88px;resize:vertical}.generator button{justify-self:start;border:0;border-radius:5px;padding:13px 20px;background:var(--blue);color:var(--white);font:800 1rem "Nunito Sans",sans-serif;cursor:pointer}.generator button:hover{background:var(--navy-deep)}.generator .hint{font-size:.82rem;margin:0}.success{display:none;margin:4px 0 0;color:var(--blue);font-weight:900}.success.show{display:block}
    </style>
  </head>
  <body>
    <main class="generator">
      <img src="asj-hotdog-logo.png" alt="ASJ Hotdog" class="generator-logo" />
      <p class="campaign-kicker">Painel de atualização</p>
      <h1>Atualize a campanha.</h1>
      <p>Preencha os dados atuais. Ao baixar, substitua o arquivo <strong>app.js</strong> no repositório e publique no GitHub Pages.</p>
      <form id="generator-form">
        <label>Meta da campanha (R$)<input id="goal" type="number" min="1" step="0.01" value="1000" required /></label>
        <label>Valor já arrecadado (R$)<input id="raised" type="number" min="0" step="0.01" value="20" required /></label>
        <label>Quantas pessoas doaram?<input id="donors" type="number" min="0" step="1" value="1" required /></label>
        <label>Data da atualização<input id="updated" type="date" required /></label>
        <label>Mensagem de incentivo<textarea id="message">Estamos no começo. Sua ajuda faz a diferença.</textarea></label>
        <button type="submit">Baixar app.js atualizado</button>
        <p class="hint">O dashboard exibirá um hotdog para cada R$ 1,00 arrecadado.</p>
        <p class="success" id="success" role="status">Arquivo gerado. Agora envie-o para o GitHub, substituindo o app.js anterior.</p>
      </form>
    </main>
    <script src="generator.js"></script>
  </body>
</html>
